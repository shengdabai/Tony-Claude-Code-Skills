name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Validate SKILL.md frontmatter (warnings only)
        run: |
          set +e
          source tools/skill-collections.sh
          warn=0
          total=0
          ok=0

          for dir in skills/*/; do
            [ -d "$dir" ] || continue
            skill_name=$(basename "$dir")

            # Skip infrastructure / collection containers
            if is_skill_collection "$skill_name"; then
              continue
            fi

            total=$((total+1))
            if [ ! -f "$dir/SKILL.md" ]; then
              echo "⚠️  $skill_name: missing SKILL.md"
              warn=$((warn+1))
              continue
            fi

            missing=""
            grep -q "^name:" "$dir/SKILL.md" || missing="${missing}name "
            grep -q "^description:" "$dir/SKILL.md" || missing="${missing}description"

            if [ -n "$missing" ]; then
              echo "⚠️  $skill_name: missing frontmatter fields ($missing)"
              warn=$((warn+1))
            else
              ok=$((ok+1))
            fi
          done

          echo ""
          echo "📊 Summary: $ok/$total skills have complete frontmatter ($warn warnings)"
          echo "✅ Validation complete (warnings do not fail the build)"

      - name: Privacy scan (no real secrets in tracked files)
        run: |
          set -e
          patterns='sk-(proj|ant|live)-[a-zA-Z0-9_-]{40,}|ghp_[a-zA-Z0-9]{36}|AKIA[A-Z0-9]{16}|AIza[a-zA-Z0-9_-]{30,}|xoxb-[a-zA-Z0-9-]{20,}|cli_a[0-9a-f]{30}'

          hits=$(git ls-files | xargs grep -lE "$patterns" 2>/dev/null \
            | grep -vE "_repos/|_collections/|THIRD_PARTY|NOTICE|hooks/secret-scan|hooks/sync-skills|cso/SKILL\.md|gstack-cso/SKILL\.md|CHANGELOG\.md|placeholder|YOUR_|<your|REDACTED|/test/|/tests/|/__tests__/|\.test\.|\.spec\.|fixtures?/" \
            || true)

          if [ -n "$hits" ]; then
            echo "❌ 真凭证扫描命中:"
            echo "$hits"
            exit 1
          fi
          echo "✅ 隐私扫描通过 (0 real credentials in tracked files)"

      - name: No nested .git directories
        run: |
          nested=$(find . -name .git -type d -not -path "./.git" -not -path "./skills/_repos/*" 2>/dev/null)
          if [ -n "$nested" ]; then
            echo "❌ 发现嵌套 .git:"
            echo "$nested"
            exit 1
          fi
          echo "✅ 无嵌套 .git"

  # tools/validate-skills.sh is not run here yet: on a case-sensitive
  # filesystem it fails because skills/limit-continue-work/ ships `skill.md`
  # instead of `SKILL.md`. Add it once that file is renamed.
  script-tests:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Run scripts/tests (all unittest suites)
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
